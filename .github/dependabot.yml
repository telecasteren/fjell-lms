version: 2

registries:
  npm:
    versioning-strategy: increase

updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "telecasteren"
    assignees:
      - "telecasteren"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Group related updates together
    groups:
      next-js:
        patterns:
          - "next*"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
          - "@testing-library/*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "eslint-*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-*"
      ui-components:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
    # Ignore specific packages that require manual review
    ignore:
      # Major Node.js version updates need manual testing
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Database-related packages need careful review
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      # Authentication packages need security review
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major"]
      # Framework major updates need thorough testing
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "telecasteren"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    labels:
      - "github-actions"
      - "dependencies"
      - "automated"
    groups:
      actions-core:
        patterns:
          - "actions/*"
      security-actions:
        patterns:
          - "github/codeql-action*"
          - "trufflesecurity/*"
          - "aquasecurity/*"

  # Docker dependencies (if Dockerfile exists)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "telecasteren"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "docker"
      - "dependencies"
      - "automated"
