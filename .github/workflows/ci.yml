name: CI

on:
  push:
    branches: [main, web]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000
      # Required for Bunny CDN (can be dummy values for tests)
      BUNNY_API_KEY: dummy-key-for-tests
      BUNNY_STORAGE_ZONE: fox-lms
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Setup database
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup E2E test data
        run: node scripts/create-e2e-test-users.mjs

      - name: E2E Tests
        run: |
          npx playwright install --with-deps
          npm run test:e2e
