name: Production Deployment

on:
  push:
    branches: [web]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: "Skip pre-deployment tests"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  pre-deployment-checks:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      deployment-url: ${{ steps.deployment-url.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Environment validation
        run: |
          echo "Validating required environment variables..."

          REQUIRED_VARS=(
            "VERCEL_ORG_ID"
            "VERCEL_PROJECT_ID"
            "DATABASE_URL"
            "NEXTAUTH_SECRET"
            "NEXTAUTH_URL"
          )

          MISSING_VARS=""

          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var}" ]; then
              MISSING_VARS="$MISSING_VARS $var"
            fi
          done

          if [ -n "$MISSING_VARS" ]; then
            echo "❌ Missing required environment variables:$MISSING_VARS"
            exit 1
          else
            echo "✅ All required environment variables are set"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Build verification
        env:
          DATABASE_URL: file:./deploy-test.db
          NEXTAUTH_SECRET: deploy-test-secret
          NEXTAUTH_URL: http://localhost:3000
        run: |
          npx prisma generate
          npm run build

      - name: Generate version info
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Set deployment URL
        id: deployment-url
        run: |
          if [ "${{ inputs.environment }}" == "staging" ]; then
            echo "url=https://fox-lms-staging.vercel.app" >> $GITHUB_OUTPUT
          else
            echo "url=https://fox-lms.vercel.app" >> $GITHUB_OUTPUT
          fi

  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks]
    if: always() && (needs.pre-deployment-checks.result == 'success' || inputs.skip_tests)
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ needs.pre-deployment-checks.outputs.deployment-url || 'https://fox-lms.vercel.app' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Database migration dry run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Performing migration dry run..."
          npx prisma migrate status

          # Check if there are pending migrations
          if npx prisma migrate status | grep -q "following migration.*have not yet been applied"; then
            echo "📋 Pending migrations detected"
            npx prisma migrate status
          else
            echo "✅ Database is up to date"
          fi

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Applying database migrations..."
          npx prisma migrate deploy
          echo "✅ Database migrations completed successfully"

      - name: Post-migration validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Validating database schema..."
          npx prisma validate
          echo "✅ Database schema validation passed"

  vercel-deployment:
    name: Vercel Deployment
    runs-on: ubuntu-latest
    needs: [database-migration]
    if: always() && needs.database-migration.result == 'success'
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ needs.pre-deployment-checks.outputs.deployment-url || 'https://fox-lms.vercel.app' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ inputs.environment || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $DEPLOYMENT_URL"

      - name: Update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ inputs.environment || 'production' }}',
              description: 'Automated deployment via GitHub Actions',
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: '${{ steps.deploy.outputs.deployment-url }}',
              description: 'Deployment completed successfully'
            });

  post-deployment-tests:
    name: Post-deployment Health Checks
    runs-on: ubuntu-latest
    needs: [vercel-deployment, pre-deployment-checks]
    if: always() && needs.vercel-deployment.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for deployment to be ready
        run: |
          DEPLOYMENT_URL="${{ needs.pre-deployment-checks.outputs.deployment-url }}"
          echo "Waiting for deployment to be ready at $DEPLOYMENT_URL"

          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" "$DEPLOYMENT_URL" | grep -q "200"; then
              echo "✅ Deployment is ready!"
              break
            else
              echo "⏳ Waiting for deployment... (attempt $i/30)"
              sleep 10
            fi
          done

      - name: Health check
        run: |
          DEPLOYMENT_URL="${{ needs.pre-deployment-checks.outputs.deployment-url }}"

          # Test main page
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYMENT_URL")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Main page health check passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Main page health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

          # Test API health endpoint
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYMENT_URL/api/health")
          if [ "$API_STATUS" -eq 200 ]; then
            echo "✅ API health check passed (HTTP $API_STATUS)"
          else
            echo "⚠️ API health check returned HTTP $API_STATUS"
          fi

      - name: Performance baseline check
        run: |
          DEPLOYMENT_URL="${{ needs.pre-deployment-checks.outputs.deployment-url }}"

          # Simple performance check using curl
          RESPONSE_TIME=$(curl -o /dev/null -s -w "%{time_total}" "$DEPLOYMENT_URL")

          echo "Response time: ${RESPONSE_TIME}s"

          # Convert to milliseconds for comparison
          RESPONSE_MS=$(echo "$RESPONSE_TIME * 1000" | bc -l)

          if (( $(echo "$RESPONSE_MS < 3000" | bc -l) )); then
            echo "✅ Performance check passed (${RESPONSE_MS}ms < 3000ms)"
          else
            echo "⚠️ Performance check warning (${RESPONSE_MS}ms >= 3000ms)"
          fi

      - name: Database connectivity check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate

          # Test database connection
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            
            async function testConnection() {
              try {
                await prisma.\$connect();
                console.log('✅ Database connection successful');
                
                // Test a simple query
                const count = await prisma.user.count();
                console.log(\`Database contains \${count} users\`);
                
                await prisma.\$disconnect();
              } catch (error) {
                console.error('❌ Database connection failed:', error.message);
                process.exit(1);
              }
            }
            
            testConnection();
          "

  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs:
      [
        pre-deployment-checks,
        database-migration,
        vercel-deployment,
        post-deployment-tests,
      ]
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.pre-deployment-checks.outputs.version || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment URL:** ${{ needs.pre-deployment-checks.outputs.deployment-url || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.pre-deployment-checks.result }}" == "success" ] || [ "${{ inputs.skip_tests }}" == "true" ]; then
            echo "| Pre-deployment Checks | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Pre-deployment Checks | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.database-migration.result }}" == "success" ]; then
            echo "| Database Migration | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Database Migration | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.vercel-deployment.result }}" == "success" ]; then
            echo "| Vercel Deployment | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Vercel Deployment | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.post-deployment-tests.result }}" == "success" ]; then
            echo "| Health Checks | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Health Checks | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment completed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Check deployment status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "❌ Deployment pipeline failed - check individual jobs for details"
            exit 1
          else
            echo "✅ Deployment completed successfully!"
          fi
