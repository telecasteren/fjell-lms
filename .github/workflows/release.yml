name: Release Automation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      dry_run:
        description: "Dry run (do not create actual release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: release-automation
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  detect-changes:
    name: Detect Changes & Determine Release Type
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.changes.outputs.should-release }}
      release-type: ${{ steps.changes.outputs.release-type }}
      version: ${{ steps.changes.outputs.version }}
      changelog: ${{ steps.changes.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git conventional-changelog-conventionalcommits

      - name: Analyze commits for release type
        id: changes
        run: |
          # Manual release type from workflow dispatch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "release-type=${{ inputs.release_type }}" >> $GITHUB_OUTPUT
            echo "Manual release triggered: ${{ inputs.release_type }}"
            exit 0
          fi

          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --since="1 month ago")
          else
            COMMITS=$(git log --oneline $LAST_TAG..HEAD)
          fi

          echo "Analyzing commits for conventional format..."
          echo "$COMMITS"

          # Check for breaking changes
          if echo "$COMMITS" | grep -E "BREAKING CHANGE|!:" > /dev/null; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "release-type=major" >> $GITHUB_OUTPUT
            echo "🚨 Breaking changes detected - major release"
          # Check for features
          elif echo "$COMMITS" | grep -E "^[a-f0-9]+ feat(\(.+\))?:" > /dev/null; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "release-type=minor" >> $GITHUB_OUTPUT
            echo "✨ New features detected - minor release"
          # Check for fixes
          elif echo "$COMMITS" | grep -E "^[a-f0-9]+ fix(\(.+\))?:" > /dev/null; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "release-type=patch" >> $GITHUB_OUTPUT
            echo "🐛 Bug fixes detected - patch release"
          # Check for other conventional commits
          elif echo "$COMMITS" | grep -E "^[a-f0-9]+ (docs|style|refactor|perf|test|chore)(\(.+\))?:" > /dev/null; then
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "release-type=none" >> $GITHUB_OUTPUT
            echo "📝 No release-worthy changes detected"
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "release-type=none" >> $GITHUB_OUTPUT
            echo "ℹ️ No conventional commits found"
          fi

      - name: Generate version number
        id: version
        if: steps.changes.outputs.should-release == 'true'
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Calculate next version based on release type
          RELEASE_TYPE="${{ steps.changes.outputs.release-type }}"

          case $RELEASE_TYPE in
            major)
              NEXT_VERSION=$(npm version major --no-git-tag-version --preid=rc)
              ;;
            minor)
              NEXT_VERSION=$(npm version minor --no-git-tag-version --preid=rc)
              ;;
            patch)
              NEXT_VERSION=$(npm version patch --no-git-tag-version --preid=rc)
              ;;
            prerelease)
              NEXT_VERSION=$(npm version prerelease --no-git-tag-version --preid=rc)
              ;;
          esac

          # Reset package.json changes
          git checkout -- package.json

          echo "version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "Next version: ${NEXT_VERSION}"

      - name: Generate changelog preview
        if: steps.changes.outputs.should-release == 'true'
        run: |
          # Install conventional-changelog-cli
          npm install -g conventional-changelog-cli

          # Generate changelog for this release
          conventional-changelog -p conventionalcommits -u > CHANGELOG_PREVIEW.md

          echo "## 📝 Changelog Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`markdown" >> $GITHUB_STEP_SUMMARY
          head -50 CHANGELOG_PREVIEW.md >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  pre-release-checks:
    name: Pre-release Quality Checks
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should-release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        env:
          DATABASE_URL: file:./release-test.db
          NEXTAUTH_SECRET: release-test-secret
          NEXTAUTH_URL: http://localhost:3000
        run: |
          echo "🔍 Running pre-release quality checks..."

          # TypeScript compilation
          npx tsc --noEmit
          echo "✅ TypeScript compilation passed"

          # Linting
          npm run lint
          echo "✅ ESLint checks passed"

          # Unit tests
          npm run test
          echo "✅ Unit tests passed"

          # Build verification
          npx prisma generate
          npm run build
          echo "✅ Build verification passed"

      - name: Security audit
        run: |
          # Run security audit
          npm audit --audit-level=high
          echo "✅ Security audit passed"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [detect-changes, pre-release-checks]
    if: needs.detect-changes.outputs.should-release == 'true' && needs.pre-release-checks.result == 'success'
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
      release-url: ${{ steps.create-release.outputs.html_url }}
      release-tag: ${{ steps.create-release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install dependencies
        run: npm ci

      - name: Update version in package.json
        if: ${{ !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ needs.detect-changes.outputs.version }}"
          npm version $NEW_VERSION --no-git-tag-version
          echo "Updated package.json to version $NEW_VERSION"

      - name: Generate full changelog
        run: |
          npm install -g conventional-changelog-cli

          # Generate changelog
          conventional-changelog -p conventionalcommits -i CHANGELOG.md -s

          echo "📝 Generated changelog:"
          head -20 CHANGELOG.md

      - name: Commit version and changelog
        if: ${{ !inputs.dry_run }}
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${{ needs.detect-changes.outputs.version }}"
          git push origin main

      - name: Create GitHub release
        id: create-release
        if: ${{ !inputs.dry_run }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read changelog content for release notes
            let releaseNotes = '';
            try {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const lines = changelog.split('\n');
              
              // Extract content between first two version headers
              let capturing = false;
              for (const line of lines) {
                if (line.startsWith('## ') && !capturing) {
                  capturing = true;
                  continue;
                } else if (line.startsWith('## ') && capturing) {
                  break;
                }
                if (capturing) {
                  releaseNotes += line + '\n';
                }
              }
            } catch (error) {
              releaseNotes = 'Release notes could not be generated from changelog.';
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ needs.detect-changes.outputs.version }}',
              target_commitish: 'main',
              name: 'Release ${{ needs.detect-changes.outputs.version }}',
              body: releaseNotes.trim(),
              draft: false,
              prerelease: '${{ needs.detect-changes.outputs.release-type }}' === 'prerelease'
            });

            return {
              id: release.id,
              html_url: release.html_url,
              tag_name: release.tag_name
            };

      - name: Create release summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.detect-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ needs.detect-changes.outputs.release-type }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "**Mode:** 🧪 Dry Run (no actual release created)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Release URL:** [View Release](${{ steps.create-release.outputs.html_url }})" >> $GITHUB_STEP_SUMMARY
            echo "**Tag:** ${{ steps.create-release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 What's Next?" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment workflow will automatically trigger" >> $GITHUB_STEP_SUMMARY
          echo "- Performance monitoring will run for the new release" >> $GITHUB_STEP_SUMMARY
          echo "- Release notifications will be sent to configured channels" >> $GITHUB_STEP_SUMMARY

  post-release-actions:
    name: Post-release Actions
    runs-on: ubuntu-latest
    needs: [detect-changes, create-release]
    if: needs.create-release.result == 'success' && !inputs.dry_run
    steps:
      - name: Trigger deployment workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: '${{ needs.create-release.outputs.release-tag }}',
              inputs: {
                environment: 'production',
                skip_tests: 'false'
              }
            });

            console.log('✅ Triggered production deployment workflow');

      - name: Trigger performance monitoring
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'performance.yml',
              ref: 'main'
            });

            console.log('✅ Triggered performance monitoring workflow');

      - name: Create milestone for next version
        uses: actions/github-script@v7
        with:
          script: |
            const currentVersion = '${{ needs.detect-changes.outputs.version }}';
            const versionParts = currentVersion.replace('v', '').split('.');

            // Calculate next minor version for milestone
            const nextMinor = `v${versionParts[0]}.${parseInt(versionParts[1]) + 1}.0`;

            try {
              await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: nextMinor,
                description: `Milestone for ${nextMinor} release`,
                state: 'open'
              });
              
              console.log(`✅ Created milestone for ${nextMinor}`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`ℹ️ Milestone ${nextMinor} already exists`);
              } else {
                throw error;
              }
            }

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs:
      [detect-changes, pre-release-checks, create-release, post-release-actions]
    if: always()
    steps:
      - name: Generate final summary
        run: |
          echo "## 📊 Release Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.should-release }}" != "true" ]; then
            echo "🔍 **Result:** No release created - no significant changes detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Criteria for automatic releases:**" >> $GITHUB_STEP_SUMMARY
            echo "- \`feat:\` commits trigger minor releases" >> $GITHUB_STEP_SUMMARY
            echo "- \`fix:\` commits trigger patch releases" >> $GITHUB_STEP_SUMMARY
            echo "- Breaking changes trigger major releases" >> $GITHUB_STEP_SUMMARY
            echo "- Use workflow dispatch for manual releases" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Stage | Status | Details |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY
            
            echo "| Change Detection | ✅ Complete | ${{ needs.detect-changes.outputs.release-type }} release |" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ needs.pre-release-checks.result }}" == "success" ]; then
              echo "| Quality Checks | ✅ Passed | All checks passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Quality Checks | ❌ Failed | Pre-release checks failed |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "${{ needs.create-release.result }}" == "success" ]; then
              if [ "${{ inputs.dry_run }}" == "true" ]; then
                echo "| Release Creation | 🧪 Dry Run | No actual release created |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| Release Creation | ✅ Success | Release ${{ needs.detect-changes.outputs.version }} created |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| Release Creation | ❌ Failed | Release creation failed |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "${{ needs.post-release-actions.result }}" == "success" ]; then
              echo "| Post-release Actions | ✅ Complete | Deployment and monitoring triggered |" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ inputs.dry_run }}" == "true" ]; then
              echo "| Post-release Actions | ⏭️ Skipped | Dry run mode |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Post-release Actions | ❌ Failed | Post-release actions failed |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
