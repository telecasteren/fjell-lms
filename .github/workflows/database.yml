name: Database Operations

on:
  push:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "scripts/**"
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      operation:
        description: "Database operation to perform"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - migrate-dev
          - reset-dev
          - seed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  schema-validation:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Format schema
        run: |
          npx prisma format
          if [ -n "$(git diff --name-only)" ]; then
            echo "❌ Schema is not formatted properly"
            echo "Run 'npx prisma format' to fix formatting"
            git diff
            exit 1
          else
            echo "✅ Schema is properly formatted"
          fi

  migration-validation:
    name: Migration Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema (using db push for CI)
        run: npx prisma db push --accept-data-loss

      - name: Validate database schema
        run: npx prisma validate

      - name: Check migration status
        run: npx prisma migrate status || true

  seed-testing:
    name: Seed Data Testing
    runs-on: ubuntu-latest
    needs: [schema-validation]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/seedtest
      NEXTAUTH_SECRET: seed-test-secret
      NEXTAUTH_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: seedtest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema
        run: npx prisma db push --accept-data-loss

      - name: Run seed scripts
        run: |
          # Test dev user creation script
          node scripts/create-dev-user.mjs
          echo "✅ Dev user creation script executed successfully"

      - name: Validate seeded data
        run: |
          # Use Prisma Studio in headless mode to validate data
          npx prisma studio --port 5555 &
          STUDIO_PID=$!
          sleep 5

          # Basic validation that database has expected data
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            
            async function validate() {
              const userCount = await prisma.user.count();
              const deptCount = await prisma.department.count();
              
              console.log(\`Users: \${userCount}, Departments: \${deptCount}\`);
              
              if (userCount === 0) {
                throw new Error('No users found after seeding');
              }
              
              if (deptCount === 0) {
                throw new Error('No departments found after seeding');
              }
              
              console.log('✅ Seed data validation passed');
              await prisma.\$disconnect();
            }
            
            validate().catch(console.error);
          "

          kill $STUDIO_PID

  migration-safety:
    name: Migration Safety Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: pr/package-lock.json

      - name: Install dependencies
        working-directory: pr
        run: npm ci

      - name: Compare schemas
        run: |
          echo "## 📊 Database Schema Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if diff -u base/prisma/schema.prisma pr/prisma/schema.prisma > schema-diff.txt; then
            echo "No schema changes detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Schema Diff:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            cat schema-diff.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for destructive changes
        run: |
          cd pr

          # Check for potentially destructive migration patterns
          DESTRUCTIVE_PATTERNS=(
            "DROP TABLE"
            "DROP COLUMN"
            "ALTER.*DROP"
            "DROP INDEX"
            "DROP CONSTRAINT"
          )

          FOUND_DESTRUCTIVE=""

          for pattern in "${DESTRUCTIVE_PATTERNS[@]}"; do
            if find prisma/migrations -name "*.sql" -type f -exec grep -l "$pattern" {} \; | grep -q .; then
              FOUND_DESTRUCTIVE="$FOUND_DESTRUCTIVE\n- Found pattern: $pattern"
            fi
          done

          if [ -n "$FOUND_DESTRUCTIVE" ]; then
            echo "⚠️ **WARNING: Potentially destructive migration patterns detected:**" >> $GITHUB_STEP_SUMMARY
            echo -e "$FOUND_DESTRUCTIVE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review these changes carefully before merging." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No destructive migration patterns detected" >> $GITHUB_STEP_SUMMARY
          fi

  database-backup-test:
    name: Database Backup Test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/backuptest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: backuptest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          node scripts/create-dev-user.mjs

      - name: Create database backup
        run: |
          # Create PostgreSQL backup
          pg_dump $DATABASE_URL > backup.sql
          
          echo "✅ Database backup created"

      - name: Test backup restoration
        run: |
          # Drop and recreate database (simulate restoration scenario)
          psql $DATABASE_URL -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          
          # Restore from backup
          psql $DATABASE_URL < backup.sql

          # Verify data integrity
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            
            async function verify() {
              const count = await prisma.user.count();
              console.log(\`Restored database has \${count} users\`);
              
              if (count === 0) {
                throw new Error('Backup restoration failed - no data found');
              }
              
              console.log('✅ Backup restoration verified');
              await prisma.\$disconnect();
            }
            
            verify().catch(console.error);
          "

  database-summary:
    name: Database Operations Summary
    runs-on: ubuntu-latest
    needs: [schema-validation, migration-validation, seed-testing]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🗄️ Database Operations Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Operation | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.schema-validation.result }}" == "success" ]; then
            echo "| Schema Validation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Schema Validation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.migration-validation.result }}" == "success" ]; then
            echo "| Migration Validation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Migration Validation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.seed-testing.result }}" == "success" ]; then
            echo "| Seed Testing | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Seed Testing | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Database Operations Workflow:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
